services:
  postgres:
    image: postgres:16-alpine
    container_name: mattermost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpassword
      POSTGRES_DB: mattermost
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmpassword@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
    volumes:
      - ./data/mattermost_data:/mattermost/data
      - ./data/mattermost_logs:/mattermost/logs
      - ./data/mattermost_config:/mattermost/config
      - ./data/mattermost_plugins:/mattermost/plugins
      - ./data/mattermost_client_plugins:/mattermost/client/plugins
